# Local Postgres matching the CI service (postgres:17). Set POSTGRES_PORT when
# 5432 is already taken on the host, e.g. `POSTGRES_PORT=5433 docker compose up -d`.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrownik
      POSTGRES_PASSWORD: hrownik
      POSTGRES_DB: hrownik
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrownik -d hrownik"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
